<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Residency Logbook (ต้นแบบทดสอบ)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --celadon:#007BA7; --celadon-d:#005A7A; --celadon-dd:#0B3F55; --celadon-t:#E3F1F7;
  --carib:#1AC1DD; --carib-t:#E2F7FB; --carib-d:#0E7C8F;
  --rose:#D4A5A5; --rose-t:#F8EEEE; --rose-d:#8C4A57;
  --coral:#F88379; --coral-t:#FEECEA; --coral-d:#A9443A;
  --ink:#1D2B36; --muted:#536270; --line:#D6E0E6; --bg:#F4F8FA; --card:#FFFFFF;
  --ok:#0E7C8F; --ok-t:#E2F7FB;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',system-ui,sans-serif;font-size:16px;line-height:1.55;color:var(--ink);background:var(--bg)}
a{color:var(--celadon-d)}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
h1{font-size:26px;margin:0 0 2px;line-height:1.3}
h2{font-size:19px;margin:0;line-height:1.35}
h3{font-size:17px;margin:0}
.app{display:flex;min-height:100vh}
.side{width:250px;flex-shrink:0;background:var(--celadon-dd);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand b{font-size:17px;display:block}
.brand small{color:#BFE3EE;font-size:13px}
.nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:#DDEFF5;text-align:left;cursor:pointer;width:100%}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:var(--celadon);color:#fff;font-weight:700}
.nav .cnt{margin-left:auto;background:var(--coral);color:#3A1512;font-size:13px;font-weight:700;border-radius:999px;padding:1px 8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top label{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.top select,.top input{min-height:40px;border:1px solid #B5C4CE;border-radius:8px;padding:0 10px;background:#fff}
.demo-tag{margin-left:auto;font-size:13px;color:var(--rose-d);background:var(--rose-t);border-radius:999px;padding:4px 12px;font-weight:600}
.content{padding:24px;max-width:1200px;width:100%;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px 18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat .lb{font-size:15px;color:var(--muted)}
.stat .v{font-size:30px;font-weight:700;line-height:1.2}
.stat .s{font-size:14px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--celadon);background:#fff;color:var(--celadon-d);font-weight:600;cursor:pointer}
.btn:hover{background:var(--celadon-t)}
.btn.pri{background:var(--celadon);color:#fff;border-color:var(--celadon)}
.btn.pri:hover{background:var(--celadon-d)}
.btn.warn{border-color:var(--coral-d);color:var(--coral-d)}
.btn.warn:hover{background:var(--coral-t)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.p-ok{background:var(--ok-t);color:#0A5F6E}
.p-wait{background:var(--coral-t);color:var(--coral-d)}
.p-back{background:var(--rose-t);color:var(--rose-d)}
.p-gray{background:#ECF0F3;color:#46545F}
.p-blue{background:var(--celadon-t);color:var(--celadon-d)}
.bar{height:9px;border-radius:5px;background:#E2E9EE;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--celadon)}
.bar.ok>i{background:var(--carib-d)}
.bar.low>i{background:var(--coral)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{background:#EEF4F7;text-align:left;font-weight:600;color:#3E4C57;padding:10px 12px}
td{padding:11px 12px;border-top:1px solid #E5ECF0;vertical-align:top}
.tblwrap{overflow-x:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{min-height:44px;padding:0 16px;border:0;background:transparent;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent}
.tab.on{color:var(--celadon-d);font-weight:700;border-bottom-color:var(--celadon)}
.cat{font-size:14px;font-weight:700;color:var(--rose-d);padding:14px 18px 6px;letter-spacing:.2px}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 18px;border-top:1px solid #EEF2F5;cursor:pointer;background:#fff;width:100%;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:hover{background:#F6FAFC}
.item .t{font-weight:600}
.item .r{display:flex;align-items:center;gap:10px;flex-shrink:0}
.flag{color:var(--coral-d);font-weight:700}
.field{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:15px}
.grid4>*{min-width:0}
.field input,.field select,.field textarea{min-width:0;width:100%;min-height:44px;border:1px solid #B5C4CE;border-radius:8px;padding:6px 12px;background:#fff;font-weight:400}
.field .hint{font-weight:400;font-size:13px;color:var(--muted)}
.seg{display:flex;border:1px solid #B5C4CE;border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;min-height:44px;border:0;border-right:1px solid #B5C4CE;background:#fff;cursor:pointer;padding:0 10px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--celadon);color:#fff;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 12px;border:1px solid #B5C4CE;border-radius:8px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.on{border:2px solid var(--celadon);background:var(--celadon-t);font-weight:600}
.signer{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid #B5C4CE;border-radius:10px;cursor:pointer;background:#fff;width:100%;text-align:left}
.signer.on{border:2px solid var(--celadon);background:var(--celadon-t)}
.note{border-radius:10px;padding:10px 14px;font-size:15px}
.n-info{background:var(--carib-t);color:#0B5866}
.n-warn{background:var(--coral-t);color:var(--coral-d)}
.n-rose{background:var(--rose-t);color:var(--rose-d)}
.overlay{position:fixed;inset:0;background:rgba(11,40,55,.45);display:flex;justify-content:flex-end;z-index:20}
.panel{width:min(620px,100%);height:100%;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column}
.panel-h{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;align-items:flex-start;position:sticky;top:0;z-index:2}
.panel-b{padding:18px;display:flex;flex-direction:column;gap:16px}
.x{width:44px;height:44px;border:0;background:transparent;cursor:pointer;border-radius:8px;flex-shrink:0;font-size:22px}
.x:hover{background:#EEF3F6}
.req{display:flex;flex-direction:column;gap:5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--celadon-dd);color:#fff;padding:12px 20px;border-radius:10px;z-index:40;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:90vw}
.toast.err{background:var(--coral-d)}
.score{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.score button{min-height:46px;border:1px solid #B5C4CE;border-radius:8px;background:#fff;font-size:18px;font-weight:700;cursor:pointer}
.score button.on.pass{background:var(--carib-d);color:#fff;border-color:var(--carib-d)}
.score button.on.fail{background:var(--coral-d);color:#fff;border-color:var(--coral-d)}
.reqcard{background:#fff;border:2px solid var(--celadon);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:15px}
.result{border-radius:12px;padding:14px 16px;font-size:16px}
.result.ok{background:var(--ok-t);color:#0A5F6E;border:1px solid #9BDCE8}
.result.no{background:var(--coral-t);color:var(--coral-d);border:1px solid #F5B9B2}
@media (max-width:860px){
  .app{flex-direction:column}
  .side{width:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:6px}
  .brand{display:none}
  .nav{width:auto;white-space:nowrap}
  .content{padding:16px}
  .top{padding:10px 16px}
  .demo-tag{margin-left:0}
  .top label{width:100%}
  .top label select,.top label input{flex:1;min-width:0}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat .v{font-size:24px}
}
</style>
</head>

function activeRotation(tid,date){ return S.rotations.find(r=>r.trainee===tid&&r.start<=date&&date<=r.end); }
function grantDesc(g){
  const who = g.st==='user' ? U(g.sid).name : `${g.roles.map(r=>ROLE_TXT[r]).join(' / ')} ทุกคนใน ${UNITS[g.unit].name}`;
  const tr = {individual:()=>U(g.tid).name, unit:()=>`ทุกคนที่สังกัด ${UNITS[g.unit].name}`, rotation:()=>`ผู้ที่หมุนเวียนมา ${UNITS[g.unit].name}`, branch:()=>`ทุกคนในสาขา${BR[g.branch]}`}[g.ts]();
  const it = {all:'ทุกหัวข้อ', year:`เฉพาะปีที่ ${g.isv}`, category:`หมวด: ${g.isv}`, item:`หัวข้อ ${g.isv}`}[g.is];
  return {who,tr,it};
}
function grantHits(g,signer,trainee,item,date){
  if(g.st==='user'){ if(g.sid!==signer.id) return false; }
  else { if(signer.unit!==g.unit || !g.roles.some(r=>signer.roles.includes(r))) return false; }
  if(g.ts==='individual' && g.tid!==trainee.id) return false;
  if(g.ts==='unit' && trainee.unit!==g.unit) return false;
  if(g.ts==='rotation' && !S.rotations.some(r=>r.trainee===trainee.id&&r.unit===g.unit&&r.start<=date&&date<=r.end)) return false;
  if(g.ts==='branch' && trainee.branch!==g.branch) return false;
  if(g.is==='year' && String(item.y)!==String(g.isv)) return false;
  if(g.is==='category' && item.cat!==g.isv) return false;
  if(g.is==='item' && item.id!==g.isv) return false;
  if(g.from && date<g.from) return false;
  if(g.to && date>g.to) return false;
  return true;
}

  if(!signer||!trainee||!item) return {ok:false,why:'ข้อมูลไม่ครบ'};
  if(signerId===traineeId) return {ok:false,why:'เซ็นรับรองให้ตนเองไม่ได้'};
  const hits=S.grants.filter(g=>grantHits(g,signer,trainee,item,date));
  const deny=hits.find(g=>g.effect==='deny');
  if(deny) return {ok:false,why:'มีสิทธิ์แบบ "ห้ามเซ็น" ที่ตรงกับกรณีนี้',grant:deny};
  const allows=hits.filter(g=>g.effect==='allow');
  if(!allows.length) return {ok:false,why:'ไม่มีสิทธิ์ใดครอบคลุมผู้เข้าอบรม หัวข้อ และวันที่นี้'};
  // rotation grace: if only rotation grants, signing must be within end+30 days of today
  const nonRot=allows.filter(g=>g.ts!=='rotation');
  if(!nonRot.length){
    const r=S.rotations.find(r=>r.trainee===traineeId&&allows.some(g=>g.unit===r.unit)&&r.start<=date&&date<=r.end);
    if(r && S.today>addDays(r.end,30)) return {ok:false,why:`พ้นระยะผ่อนผัน 30 วันหลังสิ้นสุดการหมุนเวียน (${fmt(addDays(r.end,30))})`,grant:allows[0]};
  }
  return {ok:true,grant:(nonRot[0]||allows[0])};
}
function eligibleSigners(traineeId,itemId,date){
  const t=U(traineeId);
  return STAFF.map(u=>({u,r:canSign(u.id,traineeId,itemId,date)})).filter(x=>x.r.ok).sort((a,b)=>{
    const pa=a.r.grant.ts==='individual'?0:a.u.unit===t.unit?1:2, pb=b.r.grant.ts==='individual'?0:b.u.unit===t.unit?1:2; return pa-pb; });
}
function recsOf(tid,item){
  const sameGroup = r => r.item===item.id || (item.shared && ITEM(r.item) && ITEM(r.item).shared===item.shared);
  return S.records.filter(r=>r.trainee===tid && sameGroup(r));
}
function itemProgress(tid,item){
  const recs=recsOf(tid,item);
  const pending=recs.filter(r=>r.status==='pending').length;
  const returned=recs.filter(r=>r.status==='returned').length;
  if(item.mode==='rating_2round'){
    const ap=recs.filter(r=>r.kind==='rating'&&r.status==='approved');
    const best=Math.max(0,...ap.map(r=>r.score||0));
    const passed=best>=4;
    const needPost=!passed && ap.length>0;
    return {passed,needPost,best,pending,returned,pct:passed?1:(pending?.5:0),reqs:[],started:recs.length>0};
  }
  const cases=recs.filter(r=>r.kind==='case'&&r.status==='approved');
  let sumNeed=0,sumHave=0;
  const reqs=item.reqs.map(q=>{
    const cnt=cases.filter(c=>q.lv==='any'||c.level===q.lv).length;
    const need=q.mn!=null?q.mn:q.tg;
    let subOk=true, subCounts=null;
    if(q.ps){ subCounts=item.subs.map(s=>({s,c:cases.filter(c=>c.subs.includes(s)).length})); subOk=subCounts.every(x=>x.c>=q.ps); }
    sumNeed+=q.tg; sumHave+=Math.min(cnt,q.tg);
    return {q,cnt,need,met:cnt>=need&&subOk,subCounts,subOk};
  });
  const passed=reqs.length>0&&reqs.every(r=>r.met);
  return {passed,pending,returned,pct:sumNeed?sumHave/sumNeed:0,reqs,started:recs.length>0};
}
function requiredUnits(tid,year){
  const t=U(tid);
  const items=S.items.filter(i=>i.b===t.branch&&i.y===year&&i.status==='active');
  const req=items.filter(i=>!i.cg && (i.flag!=='optional_unit' || (S.unitReq[t.unit]||{})[i.id]));
  const groups={};
  items.filter(i=>i.cg).forEach(i=>{(groups[i.cg]=groups[i.cg]||[]).push(i);});
  return {req,groups};
}
function groupStatus(tid,cg,members){
  const def=MASTER.choiceGroups[cg];
  const passed=members.filter(i=>itemProgress(tid,i).passed);
  const subs=def.subgroups.filter(s=>s!=='Other');
  const covered=subs.filter(s=>passed.some(i=>i.cgs===s));
  return {def,passed,covered,subs,ok:passed.length>=def.choose_n && covered.length===subs.length};
}
function logbook(tid,year){
  const {req,groups}=requiredUnits(tid,year);
  let done=req.filter(i=>itemProgress(tid,i).passed).length, total=req.length;
  Object.keys(groups).forEach(cg=>{ total+=1; if(groupStatus(tid,cg,groups[cg]).ok) done+=1; });
  return {done,total,pct:total?done/total:0};
}

const ACT = {
  go:d=>{S.view=d.v;S.ui.panel=null;},
  reset:()=>{ if(confirm('รีเซ็ตข้อมูลตัวอย่างทั้งหมด?')){ try{localStorage.removeItem(KEY);}catch(e){} seed(); toast('รีเซ็ตแล้ว'); } },

  open:d=>openItem(d.id), close:()=>{S.ui.panel=null;}, closebg:(d,e)=>{ if(e.target.classList.contains('overlay')) S.ui.panel=null; else return false; },
  newrec:()=>newForm(), cancelform:()=>{S.ui.panel.form=null;},
  flevel:d=>{S.ui.panel.form.level=d.l;}, fsub:d=>{const f=S.ui.panel.form;f.subs=f.subs.includes(d.s)?f.subs.filter(x=>x!==d.s):[...f.subs,d.s];},

    if(i.mode==='rating_with_cases'&&i.subs.length&&!F.subs.length){toast('กรุณาเลือกข้อย่อยอย่างน้อย 1 ข้อ',true);return;}
    if(F.date>S.today){toast('วันที่ปฏิบัติต้องไม่เกินวันนี้',true);return;}
    S.records.push({id:'r'+(S.seq++),kind:i.mode==='rating_with_cases'?'case':'rating',trainee:S.user,item:i.id,date:F.date,unit:F.unit,level:i.mode==='rating_with_cases'?F.level:null,subs:F.subs,ref:F.ref,round:i.mode==='rating_2round'?(p.needPost?'post':'initial'):null,signer:F.signer,status:'pending',method:null,score:null,comment:'',signedAt:null});
    P.form=null; toast('ส่งขอรับรองถึง '+U(F.signer).name+' แล้ว');
  },
  withdraw:d=>{const r=S.records.find(x=>x.id===d.id); S.records=S.records.filter(x=>x!==r); toast('ดึงคำขอคืนแล้ว');},
  resend:d=>{const r=S.records.find(x=>x.id===d.id); r.status='pending'; r.comment=''; toast('ส่งใหม่ถึง '+U(r.signer).name+' แล้ว');},
  cur:d=>{S.ui.cur=d.id;}, sel:(d,e)=>{S.ui.sel=S.ui.sel||{}; S.ui.sel[d.id]=e.target.checked;},

  amethod:d=>{S.ui.appr.method=d.m;}, ascore:d=>{S.ui.appr.score=+d.n;},
  approve:()=>signCur('approved'), return:()=>signCur('returned'), reject:()=>signCur('rejected'),
  bulk:()=>{ let ok=0,no=0; Object.keys(S.ui.sel||{}).filter(k=>S.ui.sel[k]).forEach(id=>{const r=S.records.find(x=>x.id===id); if(!r||r.status!=='pending') return; if(canSign(S.user,r.trainee,r.item,r.date).ok){Object.assign(r,{status:'approved',method:'OJT',score:4,signedAt:S.today});ok++;} else no++;}); S.ui.sel={}; audit('รับรองหลายรายการ',`${ok} รายการ`); toast(`รับรองแล้ว ${ok} รายการ`+(no?` · ข้ามที่ไม่มีสิทธิ์ ${no}`:''),!!no); },
  gset:d=>{S.ui.g[d.k]=d.v;},
  addgrant:()=>{ const me=U(S.user),G=S.ui.g,unit=me.roles.includes('SUPER_ADMIN')?G.unit:me.unit;
    if(G.st==='user'&&!G.sid){toast('กรุณาเลือกพยาบาล',true);return;} if(G.ts==='individual'&&!G.tid){toast('กรุณาเลือกผู้เข้าอบรม',true);return;} if((G.is==='year'||G.is==='category')&&!G.isv){toast('กรุณาระบุขอบเขตหัวข้อ',true);return;}
    const g={id:'g'+Date.now(),unit,st:G.st,sid:G.sid,roles:[...G.roles],ts:G.ts,tid:G.tid,is:G.is,isv:G.isv,effect:G.effect,from:G.from,to:G.to,by:S.user,note:'เพิ่มโดย '+me.name};
    S.grants.push(g); const d=grantDesc(g); audit(g.effect==='allow'?'เพิ่มสิทธิ์เซ็น':'เพิ่มสิทธิ์ห้ามเซ็น',`${d.who} → ${d.tr} · ${d.it}`); S.ui.g=null; toast('บันทึกสิทธิ์แล้ว มีผลทันที'); },
  delgrant:d=>{const g=S.grants.find(x=>x.id===d.id); const ds=grantDesc(g); S.grants=S.grants.filter(x=>x!==g); audit('ถอนสิทธิ์',`${ds.who} → ${ds.tr}`); toast('ถอนสิทธิ์แล้ว');},
  addrot:()=>{const R=S.ui.r; if(R.end<R.start){toast('วันสิ้นสุดต้องหลังวันเริ่ม',true);return;} if(U(R.trainee).unit===R.unit){toast('หน่วยปลายทางต้องไม่ใช่หน่วยต้นสังกัด',true);return;} S.rotations.push({id:'ro'+Date.now(),trainee:R.trainee,unit:R.unit,start:R.start,end:R.end,by:S.user}); audit('เพิ่มการหมุนเวียน',`${U(R.trainee).name} → ${UNITS[R.unit].name} ${fmt(R.start)}–${fmt(R.end)}`); toast('เพิ่มการหมุนเวียนแล้ว');},

  toggleopt:(d,e)=>{const u=U(S.user).unit; S.unitReq[u]=S.unitReq[u]||{}; S.unitReq[u][d.id]=e.target.checked; audit(e.target.checked?'เปิดข้อ *** เป็นข้อบังคับของหน่วย':'ปิดข้อ *** ของหน่วย',`${d.id} (${UNITS[u].name})`); toast(e.target.checked?'ตั้งเป็นข้อบังคับของหน่วยแล้ว':'ยกเลิกข้อบังคับแล้ว');},
  tyear:d=>{S.ui.ty=+d.y;S.ui.ti=null;S.ui.edit=null;}, tsel:d=>{S.ui.ti=d.id;S.ui.edit=null;},
  addreq:()=>{S.ui.edit.reqs.push({lv:'actual',tg:1,mn:null,ps:null});}, delreq:d=>{S.ui.edit.reqs.splice(+d.ix,1);},
  tcancel:()=>{S.ui.edit=null;},
  tsave:()=>{const E=S.ui.edit; const ix=S.items.findIndex(i=>i.id===E.id); S.items[ix]=JSON.parse(JSON.stringify(E)); S.draftChanges++; audit('แก้ไขหัวข้อ (ฉบับร่าง)',`${E.id} ${E.t}`); toast('บันทึกในฉบับร่างแล้ว · มีผลกับผู้เข้าอบรมทันทีในต้นแบบนี้');},
  archive:()=>{const E=S.ui.edit; E.status=E.status==='archived'?'active':'archived'; const ix=S.items.findIndex(i=>i.id===E.id); S.items[ix].status=E.status; S.draftChanges++; audit(E.status==='archived'?'Archive หัวข้อ':'นำหัวข้อกลับมาใช้',E.id); toast(E.status==='archived'?'Archive แล้ว · ไม่นับในเกณฑ์ แต่ประวัติยังอยู่':'นำกลับมาใช้แล้ว');},
  additem:()=>{const b=S.ui.tb||'CRIT',y=S.ui.ty||2; const no=Math.max(0,...S.items.filter(i=>i.b===b&&i.y===y).map(i=>i.no))+1; const id=`${b}-Y${y}-${String(no).padStart(3,'0')}`; const cat=S.items.find(i=>i.b===b&&i.y===y).cat; S.items.push({id,b,y,no,cat,t:'หัวข้อใหม่ (แก้ชื่อ)',flag:'standard',mode:b==='GEN'?'rating_2round':'rating_with_cases',shared:'',cg:'',cgs:'',subs:[],reqs:b==='GEN'?[]:[{lv:'any',tg:2,mn:null,ps:null}],note:'',status:'active'}); S.ui.ti=id; S.ui.edit=null; S.draftChanges++; audit('เพิ่มหัวข้อ (ฉบับร่าง)',id); toast('เพิ่มหัวข้อ '+id+' แล้ว');},
  publish:()=>{audit('Publish ฉบับ 2570',`${S.draftChanges} การเปลี่ยนแปลง`); S.draftChanges=0; toast('Publish ฉบับ 2570 แล้ว (จำลอง)');}

function signCur(status){
  const r=S.records.find(x=>x.id===S.ui.cur); const A=S.ui.appr;
  if(status!=='approved' && !A.comment.trim()){toast('กรุณาระบุเหตุผล',true);return;}
  const chk=canSign(S.user,r.trainee,r.item,r.date);
  if(status==='approved'&&!chk.ok){toast('รับรองไม่ได้: '+chk.why,true);return;}
  Object.assign(r,{status,method:status==='approved'?A.method:null,score:status==='approved'?A.score:null,comment:A.comment,signedAt:S.today});
  audit({approved:'รับรอง',returned:'ส่งกลับแก้ไข',rejected:'ไม่รับรอง'}[status],`${U(r.trainee).name} · ${r.item}${status==='approved'?' · คะแนน '+A.score:''}`);
  S.ui.appr=null; S.ui.cur=null;
  toast({approved:A.score>=4?'รับรองแล้ว (ผ่าน)':'รับรองแล้ว (คะแนนไม่ผ่าน)',returned:'ส่งกลับให้แก้ไขแล้ว',rejected:'บันทึกไม่รับรองแล้ว'}[status]);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const fn=ACT[el.dataset.act]; if(!fn) return;
  if(el.type==='checkbox'){ fn(el.dataset,e); save(); render(); return; }
  e.preventDefault(); e.stopPropagation();
  if(fn(el.dataset,e)===false) return;
  save(); render();
});
document.addEventListener('change',e=>{
  const el=e.target; const k=el.dataset.change; if(!k) return;
  const v=el.value;
  if(k==='user'){S.user=v;S.view=null;S.ui={};}
  else if(k==='today'){ if(v) S.today=v; }
  else if(k==='q'){S.ui.q=v;}
  else if(k==='tb'){S.ui.tb=v;S.ui.ti=null;S.ui.edit=null;}
  else if(k.startsWith('f.')){S.ui.panel.form[k.slice(2)]=v;}
  else if(k.startsWith('a.')){S.ui.appr[k.slice(2)]=v;}
  else if(k.startsWith('g.')){const f=k.slice(2); if(f==='role') S.ui.g.roles=[v]; else S.ui.g[f]=v; if(f==='is') S.ui.g.isv='';}
  else if(k.startsWith('t.')){S.ui.t[k.slice(2)]=v;}
  else if(k.startsWith('r.')){S.ui.r[k.slice(2)]=v;}
  else if(k.startsWith('e.rq.')){const [,,ix,f]=k.split('.'); S.ui.edit.reqs[+ix][f]= f==='lv'?v:(v===''?null:+v);}
  else if(k==='e.subs'){S.ui.edit.subs=v.split(',').map(s=>s.trim()).filter(Boolean);}
  else if(k.startsWith('e.')){S.ui.edit[k.slice(2)]=v;}
  if(!S.view){ S.view=navFor(U(S.user))[0][0]; }
  save(); render();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.ui.panel){S.ui.panel=null;render();} });

S = load(); if(!S || !S.items) seed();
render();
</script>
</body>
</html>
